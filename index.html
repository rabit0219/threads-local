<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>로컬 쓰레드</title>
<style>
:root {
  --bg: #ffffff; --bg2: #f5f5f5; --fg: #000000; --muted: #999999;
  --line: #e5e5e5; --line2: #d5d5d5; --btn: #000000; --btnfg: #ffffff;
  --like: #ff3040; --sheet: #ffffff; --ovl: rgba(0,0,0,.4); --field: #f7f7f7;
  --avbg: #d8d8d8; --avfg: #ffffff;
}
html[data-theme="dark"] {
  --bg: #0a0a0a; --bg2: #181818; --fg: #f3f5f7; --muted: #777777;
  --line: #262626; --line2: #333333; --btn: #ffffff; --btnfg: #000000;
  --like: #ff3040; --sheet: #181818; --ovl: rgba(0,0,0,.6); --field: #101010;
  --avbg: #3a3a3a; --avfg: #8f8f8f;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { overflow-x: hidden; max-width: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
    "Segoe UI", Roboto, sans-serif;
  font-size: 15px; color: var(--fg); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea { font-family: inherit; color: inherit; }
textarea { resize: none; }
svg { display: block; }

.wrap { max-width: 620px; margin: 0 auto; min-height: 100vh; }

/* ===== 앱바 ===== */
.appbar {
  position: sticky; top: 0; z-index: 60; background: var(--bg);
  height: 56px; display: flex; align-items: center; justify-content: center;
  max-width: 620px; margin: 0 auto;
}
.appbar .ab-left, .appbar .ab-right {
  position: absolute; top: 0; height: 56px; display: flex; align-items: center; padding: 0 16px;
}
.appbar .ab-left { left: 0; }
.appbar .ab-right { right: 0; }
.appbar .ab-title { font-size: 16px; font-weight: 700; }
.logo { font-size: 27px; font-weight: 800; letter-spacing: -1px; line-height: 1; }

/* ===== 탭바 ===== */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 60; background: var(--bg);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar-in { max-width: 620px; margin: 0 auto; display: flex; height: 56px; }
.tabbar a { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.tabbar a.on { color: var(--fg); }
.tabbar a:active { transform: scale(.9); }

.page { padding-bottom: 96px; }

/* ===== 포스트 ===== */
.post { display: flex; gap: 11px; padding: 14px 16px 10px; position: relative; }
.post.sep { border-top: 1px solid var(--line); }
.p-col-l { width: 38px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
.p-col-r { flex: 1; min-width: 0; }
.rail { flex: 1; width: 2px; background: var(--line2); border-radius: 1px; margin-top: 8px;
  margin-bottom: -22px; min-height: 8px; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #fff; font-size: 16px; user-select: none;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.default { background: var(--avbg); }
.avatar.default svg { width: 100%; height: 100%; display: block; fill: var(--avfg); }
.avatar.sm { width: 26px; height: 26px; font-size: 12px; }
.avatar.lg { width: 66px; height: 66px; font-size: 27px; }
.p-head { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.p-name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-topic {
  font-size: 15px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0; display: inline-flex; gap: 5px; align-items: center;
}
.p-topic .chev { color: var(--muted); flex-shrink: 0; }
.p-topic:active { opacity: .5; }
.p-time { color: var(--muted); font-size: 14px; flex-shrink: 0; }
.p-sp { flex: 1; }
.p-more { color: var(--muted); padding: 2px 0 2px 10px; flex-shrink: 0; }
.p-text { font-size: 15px; line-height: 1.42; white-space: pre-wrap; word-break: break-word; }
.p-text:empty { display: none; }
.p-imgs { display: flex; gap: 8px; margin-top: 9px; overflow-x: auto; scrollbar-width: none; }
.p-imgs::-webkit-scrollbar { display: none; }
.p-imgs img {
  max-height: 340px; max-width: 86%; border-radius: 12px; border: 1px solid var(--line);
  flex-shrink: 0;
}
.p-acts { display: flex; gap: 2px; margin: 8px 0 2px -8px; }
.p-act {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 20px;
  color: var(--fg); font-size: 13px;
}
.p-act:active { background: var(--bg2); }
.p-act.liked { color: var(--like); }
.p-act .cnt { color: var(--muted); font-size: 13px; }
.p-act.liked .cnt { color: var(--like); }
.p-meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.post.clickable { cursor: pointer; }

/* 상세 */
.post.detail .p-text { font-size: 16px; }
.post.detail { padding-bottom: 4px; }
.detail-stats {
  padding: 8px 16px 14px; color: var(--muted); font-size: 14px;
}
.reply-head { padding: 14px 16px 2px; font-size: 15px; font-weight: 600; border-top: 1px solid var(--line); }
.rt-indent { padding-left: 22px; border-left: 2px solid var(--line); margin-left: 33px; }

.empty { text-align: center; color: var(--muted); padding: 64px 24px; font-size: 15px; line-height: 1.6; }

/* ===== 프로필 ===== */
.prof { padding: 18px 16px 4px; }
.prof-top { display: flex; align-items: flex-start; gap: 14px; }
.prof-info { flex: 1; min-width: 0; }
.prof-name { font-size: 22px; font-weight: 700; line-height: 1.2; }
.prof-handle { display: inline-flex; align-items: center; gap: 7px; margin-top: 5px; font-size: 15px; }
.prof-handle .sw {
  background: var(--bg2); border-radius: 12px; padding: 4px 10px; font-size: 13px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 4px;
}
.prof-bio { margin-top: 12px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
.prof-cnt { color: var(--muted); font-size: 15px; margin-top: 12px; }
.prof-btns { display: flex; gap: 8px; margin: 15px 0 4px; }
.btn-o {
  flex: 1; border: 1px solid var(--line2); border-radius: 10px; padding: 9px 0;
  font-size: 14px; font-weight: 600; text-align: center;
}
.btn-o:active { background: var(--bg2); }
.ptabs { display: flex; border-bottom: 1px solid var(--line); }
.ptabs button {
  flex: 1; padding: 13px 0; font-size: 15px; font-weight: 600; color: var(--muted);
  border-bottom: 1.5px solid transparent; margin-bottom: -1px;
}
.ptabs button.on { color: var(--fg); border-bottom-color: var(--fg); }

/* ===== 설정 ===== */
.sec-title { padding: 22px 16px 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 13px 16px;
  border-bottom: 1px solid var(--line); width: 100%; text-align: left;
}
.row:active { background: var(--bg2); }
.row-main { flex: 1; min-width: 0; }
.row-t { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.row-s { color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-r { color: var(--muted); font-size: 14px; flex-shrink: 0; }
.row.danger .row-t { color: #ff4444; }
.badge-me { background: var(--fg); color: var(--bg); font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 5px; }
.sw-toggle {
  width: 46px; height: 27px; border-radius: 14px; background: var(--line2); position: relative; flex-shrink: 0;
  transition: background .15s;
}
.sw-toggle.on { background: var(--fg); }
.sw-toggle i {
  position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%;
  background: var(--bg); transition: left .15s;
}
.sw-toggle.on i { left: 22px; }

/* ===== 모달 / 시트 ===== */
.ovl {
  position: fixed; left: 0; top: 0; width: 100%; height: 100vh; height: 100dvh;
  background: var(--ovl); z-index: 200; display: flex;
}
body.locked { position: fixed; left: 0; right: 0; width: 100%; overflow: hidden; }
.sheet {
  background: var(--sheet); width: 100%; max-width: 620px; margin: auto auto 0; border-radius: 18px 18px 0 0;
  padding-bottom: env(safe-area-inset-bottom); animation: up .18s ease-out; max-height: 86vh;
  overflow-y: auto; overscroll-behavior: contain;
}
@keyframes up { from { transform: translateY(100%); } }
.sheet-h { text-align: center; padding: 10px 16px 12px; font-size: 16px; font-weight: 700; }
.sheet-grab { width: 36px; height: 4px; background: var(--line2); border-radius: 2px; margin: 9px auto 2px; }
.sheet .row:last-child { border-bottom: none; }

.modal {
  background: var(--bg); width: 100%; max-width: 620px; margin: auto; height: 100%;
  display: flex; flex-direction: column; animation: up .18s ease-out;
}
.modal-h {
  display: flex; align-items: center; padding: 14px 16px; flex-shrink: 0;
  border-bottom: 1px solid var(--line);
}
.modal-h .m-t { flex: 1; text-align: center; font-size: 16px; font-weight: 700; }
.modal-h .m-c, .modal-h .m-d { font-size: 15px; min-width: 52px; }
.modal-h .m-d { text-align: right; font-weight: 700; }
.modal-h .m-d[disabled] { color: var(--muted); font-weight: 400; }
.modal-b { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 24px; }

.cbox { display: flex; gap: 11px; padding: 14px 16px 0; }
.cbox textarea {
  width: 100%; border: none; outline: none; background: none; font-size: 16px; line-height: 1.42;
  min-height: 26px; padding: 5px 0 0;
}
.cbox .c-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 5px; }
.cbox .c-name .chev { color: var(--muted); font-weight: 400; flex-shrink: 0; }
.c-topic {
  flex: 1; min-width: 0; border: none; outline: none; background: none;
  font-size: 15px; font-weight: 400; color: var(--fg); padding: 0;
}
.c-topic::placeholder { color: var(--muted); }
.topic-head {
  padding: 18px 16px 14px; border-bottom: 1px solid var(--line);
}
.topic-head h2 { font-size: 22px; font-weight: 700; }
.topic-head p { color: var(--muted); font-size: 14px; margin-top: 5px; }
.c-tools { display: flex; align-items: center; gap: 18px; padding: 10px 0 4px; color: var(--muted); }
.c-imgs { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.c-imgs::-webkit-scrollbar { display: none; }
.c-thumb { position: relative; flex-shrink: 0; }
.c-thumb img { height: 132px; border-radius: 10px; border: 1px solid var(--line); display: block; }
.c-thumb button {
  position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,.65); color: #fff;
  width: 22px; height: 22px; border-radius: 50%; font-size: 13px; line-height: 22px; text-align: center; padding: 0;
}
.c-add { display: flex; gap: 11px; padding: 10px 16px 16px; align-items: center; color: var(--muted); font-size: 15px; }
.c-add .avatar.sm { margin-left: 6px; }

.field { padding: 10px 16px; }
.field label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.field input, .field textarea {
  width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 12px; font-size: 16px; outline: none;
}
.field textarea { min-height: 78px; line-height: 1.4; }
.btn-fill {
  display: block; width: calc(100% - 32px); margin: 20px 16px; background: var(--btn); color: var(--btnfg);
  border-radius: 12px; padding: 13px 0; font-size: 15px; font-weight: 700; text-align: center;
}
.btn-fill[disabled] { opacity: .4; }
.avatar-pick { display: flex; align-items: center; gap: 16px; padding: 20px 16px 6px; }
.avatar-pick .ap-btns { display: flex; flex-direction: column; gap: 2px; }
.avatar-pick .ap-btns button { font-size: 14px; color: var(--muted); text-align: left; padding: 4px 0; }

.replybar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 55; background: var(--bg);
  padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
}
.replybar.open { border-top: 1px solid var(--line); }
.replybar-in { max-width: 620px; margin: 0 auto; }
.rb-ctx { padding: 4px 10px 9px; }
.rb-ctx-1 { color: var(--muted); font-size: 14px; }
.rb-ctx-2 {
  color: var(--muted); font-size: 14px; margin-top: 3px; opacity: .75;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rb-pill {
  display: flex; align-items: center; gap: 10px; width: 100%; background: var(--bg2);
  border-radius: 24px; padding: 9px 14px; text-align: left;
}
.rb-pill.open { align-items: flex-end; padding: 8px 14px; }
.rb-ph { flex: 1; color: var(--muted); font-size: 15px; }
.rb-ic { color: var(--muted); flex-shrink: 0; }
.rb-ta {
  flex: 1; min-width: 0; border: none; outline: none; background: none;
  font-size: 16px; line-height: 1.4; max-height: 118px; overflow-y: auto; padding: 4px 0;
}
.rb-post { font-weight: 700; font-size: 14px; flex-shrink: 0; padding: 4px 0 5px; }
.rb-post[disabled] { color: var(--muted); font-weight: 400; }
.rb-thumbs { display: flex; gap: 8px; padding: 0 10px 9px; overflow-x: auto; scrollbar-width: none; }
.rb-thumbs::-webkit-scrollbar { display: none; }
.rb-thumbs .c-thumb img { height: 84px; }

.imgview { position: fixed; inset: 0; background: #000; z-index: 300; display: flex; align-items: center; justify-content: center; }
.imgview img { max-width: 100%; max-height: 100%; }
.toast {
  position: fixed; bottom: 82px; left: 50%; transform: translateX(-50%); z-index: 400;
  background: var(--fg); color: var(--bg); padding: 11px 18px; border-radius: 10px; font-size: 14px;
  font-weight: 600; white-space: nowrap; animation: up .15s ease-out;
}

/* ===== 잠금 화면 ===== */
.lock {
  position: fixed; inset: 0; z-index: 1000; background: var(--bg);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.lock-card { width: 100%; max-width: 320px; text-align: center; }
.lock-logo { font-size: 56px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
.lock-desc { color: var(--muted); font-size: 14px; margin: 16px 0 22px; line-height: 1.5; }
.lock input {
  width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 14px; font-size: 16px; margin-bottom: 9px; outline: none; text-align: center;
}
.lock input:focus { border-color: var(--line2); }
.lock-btn {
  width: 100%; background: var(--btn); color: var(--btnfg); border-radius: 12px;
  padding: 13px 0; font-size: 15px; font-weight: 700; margin-top: 5px;
}
.lock-err { color: #ff4444; font-size: 13px; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="appbar" id="appbar"></header>
  <main class="page" id="app"></main>
</div>
<nav class="tabbar"><div class="tabbar-in" id="tabbar"></div></nav>
<script>
'use strict';
// =====================================================================
// 로컬 쓰레드 — 단일 HTML / IndexedDB / 서버 없음
// =====================================================================
var APP_VER = 'v1.6';
var DB_NAME = 'threads-local';
var K_ME = 'th-me';
var K_THEME = 'th-theme';

var db = null;
var ME = null;          // 현재 계정 객체
var USERS = [];         // 전체 계정
var POSTS = [];         // 전체 글
var LIKES = [];         // 전체 좋아요
var UMAP = {};          // id -> user
var KIDS = {};          // parent_id -> [post]
var LIKE_CNT = {};      // post_id -> count
var MY_LIKE = {};       // post_id -> true (현재 계정 기준)
var PROF_TAB = 'posts'; // 프로필 탭 상태
// 인라인 답글 바 상태
var RB_KEY = '';        // 어느 스레드의 바인지
var RB_TARGET = null;   // 답글을 달 대상 글 id
var RB_OPEN = false;
var RB_TEXT = '';
var RB_IMGS = [];

var appEl = document.getElementById('app');
var barEl = document.getElementById('appbar');
var tabEl = document.getElementById('tabbar');

// ===== 아이콘 =====
function ic(name, size) {
  var s = size || 24;
  var open = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">';
  var P = {
    home: '<path d="M3 10.4 12 3l9 7.4V20a1 1 0 0 1-1 1h-4.5v-6.5h-7V21H4a1 1 0 0 1-1-1z"/>',
    write: '<path d="M4 20.5h16"/><path d="M6.5 16.2 16 6.7a2.2 2.2 0 0 0-3.1-3.1L3.4 13.1v3.1z"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>',
    gear: '<path d="M4 8.6h16M4 15.4h11"/>',
    heart: '<path d="M20.4 6.6a4.6 4.6 0 0 0-6.6 0L12 8.4l-1.8-1.8a4.6 4.6 0 1 0-6.6 6.5L12 21.2l8.4-8.1' +
      'a4.6 4.6 0 0 0 0-6.5z"/>',
    bubble: '<path d="M21 11.6a8.2 8.2 0 0 1-11.9 7.3L3.6 20.4l1.6-4.7A8.2 8.2 0 1 1 21 11.6z"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="3.2"/><circle cx="8.6" cy="9.6" r="1.5"/>' +
      '<path d="m3.4 17.4 4.6-4.4 3.4 3.3 3.2-3.1 6.4 6"/>',
    back: '<path d="m15 4.5-7.5 7.5L15 19.5"/>',
    more: '<circle cx="5.2" cy="12" r="1.5" fill="currentColor" stroke="none"/>' +
      '<circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>' +
      '<circle cx="18.8" cy="12" r="1.5" fill="currentColor" stroke="none"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    x: '<path d="m6 6 12 12M18 6 6 18"/>',
    right: '<path d="m9 4.5 7.5 7.5L9 19.5"/>',
    check: '<path d="m5 12.6 4.8 4.8L19 6.4"/>'
  };
  return open + P[name] + '</svg>';
}
function icHeartFill(size) {
  var s = size || 22;
  return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="currentColor">' +
    '<path d="M20.4 6.6a4.6 4.6 0 0 0-6.6 0L12 8.4l-1.8-1.8a4.6 4.6 0 1 0-6.6 6.5L12 21.2l8.4-8.1a4.6 4.6 0 0 0 0-6.5z"/></svg>';
}

// ===== IndexedDB =====
function openDB() {
  return new Promise(function (resolve, reject) {
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function (e) {
      var d = e.target.result;
      if (!d.objectStoreNames.contains('users')) {
        d.createObjectStore('users', { keyPath: 'id', autoIncrement: true });
      }
      if (!d.objectStoreNames.contains('posts')) {
        var ps = d.createObjectStore('posts', { keyPath: 'id', autoIncrement: true });
        ps.createIndex('parent_id', 'parent_id');
        ps.createIndex('author_id', 'author_id');
      }
      if (!d.objectStoreNames.contains('likes')) {
        d.createObjectStore('likes', { keyPath: 'id' });
      }
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}
function tx(store, mode, fn) {
  return new Promise(function (resolve, reject) {
    var t = db.transaction(store, mode);
    var s = t.objectStore(store);
    var result;
    var r = fn(s);
    if (r && r.onsuccess !== undefined) {
      r.onsuccess = function () { result = r.result; };
    }
    t.oncomplete = function () { resolve(result); };
    t.onerror = function () { reject(t.error); };
    t.onabort = function () { reject(t.error); };
  });
}
function getAll(store) { return tx(store, 'readonly', function (s) { return s.getAll(); }); }
function getOne(store, id) { return tx(store, 'readonly', function (s) { return s.get(id); }); }
function put(store, obj) { return tx(store, 'readwrite', function (s) { return s.put(obj); }); }
function del(store, id) { return tx(store, 'readwrite', function (s) { return s.delete(id); }); }
function clearStore(store) { return tx(store, 'readwrite', function (s) { return s.clear(); }); }

// ===== 유틸 =====
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function rel(ts) {
  var d = Math.floor((Date.now() - ts) / 1000);
  if (d < 60) return '방금';
  if (d < 3600) return Math.floor(d / 60) + '분';
  if (d < 86400) return Math.floor(d / 3600) + '시간';
  if (d < 604800) return Math.floor(d / 86400) + '일';
  var t = new Date(ts);
  return (t.getMonth() + 1) + '월 ' + t.getDate() + '일';
}
function fullTime(ts) {
  var t = new Date(ts);
  function p(n) { return String(n).padStart(2, '0'); }
  return t.getFullYear() + '.' + p(t.getMonth() + 1) + '.' + p(t.getDate()) + ' ' +
    p(t.getHours()) + ':' + p(t.getMinutes());
}
function toast(msg) {

// 이미지 리사이즈 → dataURL (저장소 절약)
function fileToDataUrl(file) {
  return new Promise(function (resolve) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var MAX = 1200;
        var w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        try { resolve(c.toDataURL('image/jpeg', 0.82)); }
        catch (e) { resolve(fr.result); }
      };
      img.onerror = function () { resolve(fr.result); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function pickImages(cb) {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.multiple = true;
  inp.addEventListener('change', async function () {
    var out = [];
    for (var i = 0; i < inp.files.length && i < 4; i++) {
      out.push(await fileToDataUrl(inp.files[i]));
    }
    if (out.length) cb(out);
  });
  inp.click();
}

async function loadData() {
  USERS = await getAll('users');
  POSTS = await getAll('posts');
  LIKES = await getAll('likes');
  USERS.sort(function (a, b) { return a.id - b.id; });
  POSTS.sort(function (a, b) { return b.ts - a.ts; });
  UMAP = {};
  USERS.forEach(function (u) { UMAP[u.id] = u; });
  ME = UMAP[meId()] || USERS[0] || null;
  if (ME && ME.id !== meId()) setMeId(ME.id);
  KIDS = {};
  POSTS.forEach(function (p) {
    var k = p.parent_id == null ? 'root' : p.parent_id;
    (KIDS[k] = KIDS[k] || []).push(p);
  });
  Object.keys(KIDS).forEach(function (k) {
    KIDS[k].sort(function (a, b) { return a.ts - b.ts; });
  });
  LIKE_CNT = {}; MY_LIKE = {};
  LIKES.forEach(function (l) {
    LIKE_CNT[l.post_id] = (LIKE_CNT[l.post_id] || 0) + 1;
    if (ME && l.user_id === ME.id) MY_LIKE[l.post_id] = true;
  });
}
function childrenOf(id, includeChain) {
  var a = KIDS[id] || [];
  return includeChain ? a.slice() : a.filter(function (p) { return !p.chain_of; });
}
function chainOf(rootId) {
  return (KIDS[rootId] || []).filter(function (p) { return p.chain_of; });
}
// 체인 포함 전체 줄기 (루트 → 체인 꼬리)
function chainLine(root) {
  var line = [root], cur = root;
  for (;;) {
    var next = chainOf(cur.id)[0];
    if (!next) break;
    line.push(next);
    cur = next;
  }
  return line;
}
function replyCount(id) {
  var n = 0;
  childrenOf(id, false).forEach(function (c) { n += 1 + replyCount(c.id); });
  return n;
}
function ancestorsOf(p) {
  var out = [], cur = p, guard = 0;
  while (cur.parent_id != null && guard++ < 200) {
    var par = POSTS.filter(function (x) { return x.id === cur.parent_id; })[0];
    if (!par) break;
    out.unshift(par);
    cur = par;
  }
  return out;
}

// 피드 카드 = 루트 + 체인 전체
function feedCard(root, first) {
  var line = chainLine(root);
  return line.map(function (p, i) {
    return postRow(p, {
      sep: (i === 0 && !first),
      rail: i < line.length - 1
    });
  }).join('');
}

function listHtml(roots, emptyMsg) {
  if (!roots.length) return '<p class="empty">' + emptyMsg + '</p>';
  return roots.map(function (r, i) { return feedCard(r, i === 0); }).join('');
}

function viewPost(id) {
  var p = POSTS.filter(function (x) { return x.id === id; })[0];

  var anc = ancestorsOf(p);
  var html = '';
  anc.forEach(function (a) { html += postRow(a, { rail: true }); });

    ' · 좋아요 ' + (LIKE_CNT[p.id] || 0) + '개 · 답글 ' + replyCount(p.id) + '개</div>';

  // 체인 뒷부분
  var tail = chainOf(p.id);
  while (tail.length) {
    var t = tail[0];
    html += postRow(t, { sep: true });
    tail = chainOf(t.id);
  }

  var kids = childrenOf(p.id, false);
  html += '<div class="reply-head">답글 ' + (kids.length ? kids.length + '개' : '') + '</div>';
  if (!kids.length) {
    html += '<p class="empty" style="padding:32px 20px 40px">첫 번째 답글을 남겨보세요.</p>';
  } else {
    html += kids.map(function (k, i) { return replyTree(k, 0, i > 0); }).join('');
  }
  appEl.innerHTML = html;
  // 이 스레드를 처음 열었을 때만 답글 바 상태를 초기화한다
  var key = 'p' + p.id;

    RB_KEY = key; RB_TARGET = p.id; RB_OPEN = false; RB_TEXT = ''; RB_IMGS = [];
  }
  if (!RB_TARGET) RB_TARGET = p.id;
  drawReplyBar();
}

      '</div>';
  }
  var bar = document.createElement('div');

  bar.innerHTML = '<div class="replybar-in">' + inner + '</div>';
  document.body.appendChild(bar);

  });

  ta.addEventListener('blur', function () {

function replyTree(p, depth, sep) {
  var kids = childrenOf(p.id, false);

}

function parseHash() {
  var h = location.hash.replace(/^#/, '');
  if (h === '' || h === '/') return { route: 'feed' };
  var m = /^\/p\/(\d+)/.exec(h);
  if (m) return { route: 'post', id: parseInt(m[1], 10) };
  m = /^\/u\/(\d+)/.exec(h);
  if (m) return { route: 'user', id: parseInt(m[1], 10) };
  m = /^\/t\/(.+)$/.exec(h);
  if (m) {
    try { return { route: 'topic', name: decodeURIComponent(m[1]) }; }
    catch (e) { return { route: 'feed' }; }
  }
  if (h === '/me') return { route: 'me' };
  if (h === '/settings') return { route: 'settings' };
  return { route: 'feed' };
}
var _lastRoute = '';
async function render() {
  await loadData();
  if (!ME) { await ensureSeed(); await loadData(); }
  var h = parseHash();
  var key = h.route + ':' + (h.id || h.name || '');
  if (key !== _lastRoute) PROF_TAB = 'posts';
  _lastRoute = key;
  var rb = document.querySelector('.replybar');
  if (rb) rb.remove();
  renderChrome();
  document.querySelector('.tabbar').style.display = h.route === 'post' ? 'none' : '';
  if (h.route !== 'post') { RB_KEY = ''; RB_TARGET = null; RB_OPEN = false; RB_TEXT = ''; RB_IMGS = []; }
  if (h.route === 'post') viewPost(h.id);
  else if (h.route === 'user') viewUser(h.id, false);
  else if (h.route === 'me') viewUser(ME.id, true);
  else if (h.route === 'topic') viewTopic(h.name);
  else if (h.route === 'settings') viewSettings();
  else viewFeed();
  if (h.route !== 'post') window.scrollTo(0, 0);
}
function rerender() { return render(); }

var _lockY = 0;
function lockScroll() {
  if (document.body.classList.contains('locked')) return;
  _lockY = window.scrollY || window.pageYOffset || 0;
  document.body.style.top = -_lockY + 'px';
  document.body.classList.add('locked');
}
function unlockScroll() {
  if (!document.body.classList.contains('locked')) return;

}

  await P(u2, '퇴근길 하늘이 너무 예뻐서 세 번 멈춰 섰다', t - 9 * H);

  var e1 = await P(meIdNew, '오랜만에 5km 러닝. 3km 지점부터 다리가 남의 다리 같았음', t - 1 * D, null, null, '러닝');
  await P(u2, '그 구간이 제일 힘들죠. 넘기면 갑자기 편해짐', t - 1 * D + 40 * M, e1);

  await P(u3, '요즘 읽는 책 — 도시는 무엇으로 사는가. 출퇴근길에 딱 좋다', t - 2 * D, null, null, '독서');
  await P(u2, '이번 주 목표: 하루에 커밋 하나라도 남기기', t - 3 * D, null, null, '개발');
  await P(meIdNew, '로컬에 쓰레드 비슷한 걸 하나 만들어봤다. 생각보다 잘 굴러감', t - 4 * D, null, null, '개발');
  await P(u3, '냉면 시즌 끝나기 전에 한 번 더 가야 하는데', t - 6 * D);

  var seedLikes = [[a1, u2], [a1, meIdNew], [b1, meIdNew], [b1, u3], [c1, u3], [c1, u2], [e1, u3]];
  for (var i = 0; i < seedLikes.length; i++) {
    await put('likes', {
      id: seedLikes[i][0] + ':' + seedLikes[i][1],
      post_id: seedLikes[i][0], user_id: seedLikes[i][1], ts: t
    });
  }
}

// 이벤트
// =====================================================================
document.addEventListener('click', async function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.dataset.act;
  var id = el.dataset.id ? parseInt(el.dataset.id, 10) : null;

  if (act === 'back') { history.length > 1 ? history.back() : nav('#/'); return; }
  if (act === 'open') { closeOvl(); nav('#/p/' + id); return; }
  if (act === 'user') { e.stopPropagation(); closeOvl(); nav(ME && id === ME.id ? '#/me' : '#/u/' + id); return; }
  if (act === 'img') { e.stopPropagation(); openImg(el.dataset.src); return; }
  if (act === 'topic') {
    e.stopPropagation(); closeOvl();
    nav('#/t/' + encodeURIComponent(el.dataset.topic));
    return;
  }
  if (act === 'like') { e.stopPropagation(); await toggleLike(id); return; }
  if (act === 'reply') {
    e.stopPropagation();
    // 스레드 안에서는 별도 창 없이 아래 답글 바로 바로 단다
    if (parseHash().route === 'post') {
      if (RB_TARGET !== id) { RB_TEXT = ''; RB_IMGS = []; }
      RB_TARGET = id; RB_OPEN = true;
      drawReplyBar();
    } else openComposer(id);
    return;
  }
  if (act === 'rb-open') { RB_OPEN = true; drawReplyBar(); return; }
  if (act === 'rb-submit') { await submitReplyBar(); return; }
  if (act === 'rb-img') {
    pickImages(function (arr) { RB_IMGS = RB_IMGS.concat(arr).slice(0, 4); drawReplyBar(); });
    return;
  }
  if (act === 'rb-delimg') { RB_IMGS.splice(parseInt(el.dataset.idx, 10), 1); drawReplyBar(); return; }
  if (act === 'more') { e.stopPropagation(); openMore(id); return; }
  if (act === 'compose') { openComposer(null); return; }
  if (act === 'del-post') {
    closeOvl();
    if (!confirm('이 스레드와 달린 답글을 모두 삭제할까요?')) return;
    await deletePostDeep(id);
    if (parseHash().route === 'post' && parseHash().id === id) nav('#/');
    else await render();
    toast('삭제했습니다');
    return;
  }
  if (act === 'ptab') { PROF_TAB = el.dataset.tab; await render(); return; }
  if (act === 'switcher') { openSwitcher(); return; }
  if (act === 'switch') { await switchTo(id); return; }
  if (act === 'add-user') { closeOvl(); openEditor(null); return; }
  if (act === 'edit-me') { openEditor(ME); return; }
  if (act === 'edit-user') { openEditor(userById(id)); return; }
  if (act === 'e-cancel') { closeOvl(); EDIT = null; return; }
  if (act === 'e-save') { await saveEdit(); return; }
  if (act === 'e-del') { await deleteAccount(EDIT.id); return; }
  if (act === 'e-pic') {
    readEdit();
    pickImages(function (arr) { EDIT.avatar = arr[0]; drawEditor(); });
    return;
  }
  if (act === 'e-nopic') { readEdit(); EDIT.avatar = null; drawEditor(); return; }
  if (act === 'c-cancel') {
    var dirty = CBOX.some(function (b) { return b.text.trim() || b.imgs.length; });
    if (dirty && !confirm('작성 중인 내용을 버릴까요?')) return;
    closeOvl(); CBOX = []; CREPLY = null;
    return;
  }
  if (act === 'c-submit') { await submitComposer(); return; }
  if (act === 'c-addbox') { CBOX.push({ text: '', imgs: [] }); drawComposer(CBOX.length - 1); return; }
  if (act === 'c-delbox') {
    CBOX.splice(parseInt(el.dataset.box, 10), 1);
    if (!CBOX.length) CBOX = [{ text: '', imgs: [] }];
    drawComposer(0);
    return;
  }
  if (act === 'c-img') {
    var bi = parseInt(el.dataset.box, 10);
    pickImages(function (arr) {
      CBOX[bi].imgs = CBOX[bi].imgs.concat(arr).slice(0, 4);
      drawComposer(bi);
    });
    return;
  }
  if (act === 'c-delimg') {
    var b2 = parseInt(el.dataset.box, 10);
    CBOX[b2].imgs.splice(parseInt(el.dataset.idx, 10), 1);
    drawComposer(b2);
    return;
  }
  if (act === 'theme') { applyTheme(getTheme() === 'dark' ? 'light' : 'dark'); await render(); return; }
  if (act === 'passwd') { await changePassword(); return; }
  if (act === 'export') { await exportData(); return; }
  if (act === 'import') { importData(); return; }
  if (act === 'wipe') { await wipeAll(); return; }
});

function openImg(src) {
  var v = document.createElement('div');
  v.className = 'imgview';
  v.innerHTML = '<img src="' + src + '" alt="">';
  v.addEventListener('click', function () { v.remove(); });
  document.body.appendChild(v);
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    closeOvl();
    var iv = document.querySelector('.imgview');
    if (iv) iv.remove();
    if (RB_OPEN) { RB_OPEN = false; drawReplyBar(); }
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && RB_OPEN) { submitReplyBar(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && document.querySelector('[data-act="c-submit"]')) {
    submitComposer();
  }
});
window.addEventListener('hashchange', function () { closeOvl(); render(); });

// ===== 잠금 =====
var K_LOCK = 'th-lock';
async function sha256Hex(str) {
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
}
function getLock() {
  try { return JSON.parse(localStorage.getItem(K_LOCK)); } catch (e) { return null; }
}
async function saveLock(pw) {
  var salt = Array.from(crypto.getRandomValues(new Uint8Array(16)))
    .map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  localStorage.setItem(K_LOCK, JSON.stringify({ salt: salt, hash: await sha256Hex(salt + pw) }));
}
async function checkPw(pw) {
  var lock = getLock();
  if (!lock) return false;
  return (await sha256Hex(lock.salt + pw)) === lock.hash;
}
function showLockScreen() {
  return new Promise(function (resolve) {
    var isSetup = !getLock();
    var ov = document.createElement('div');
    ov.className = 'lock';
    ov.innerHTML = '<div class="lock-card">' +
      '<div class="lock-logo">@</div>' +
      '<div class="lock-desc">' + (isSetup
        ? '처음 오셨네요.<br>사용할 비밀번호를 정해주세요.'
        : '비밀번호를 입력해주세요.') + '</div>' +
      '<input type="password" id="lk1" placeholder="비밀번호" autocomplete="off" inputmode="text">' +
      (isSetup ? '<input type="password" id="lk2" placeholder="비밀번호 확인" autocomplete="off">' : '') +
      '<button class="lock-btn" id="lkgo">' + (isSetup ? '설정하고 시작하기' : '확인') + '</button>' +
      '<p class="lock-err" id="lkerr"></p></div>';
    document.body.appendChild(ov);
    var pw1 = ov.querySelector('#lk1');
    var errEl = ov.querySelector('#lkerr');
    pw1.focus();
    async function submit() {
      var v = pw1.value;
      if (isSetup) {
        var v2 = ov.querySelector('#lk2').value;
        if (v.length < 4) { errEl.textContent = '4자 이상으로 정해주세요.'; return; }
        if (v !== v2) { errEl.textContent = '두 입력이 서로 다릅니다.'; return; }
        await saveLock(v);
      } else if (!(await checkPw(v))) {
        errEl.textContent = '비밀번호가 틀렸습니다.';
        pw1.value = '';
        pw1.focus();
        return;
      }
      try { sessionStorage.setItem('th-unlocked', '1'); } catch (e) {}
      ov.remove();
      resolve();
    }
    ov.querySelector('#lkgo').addEventListener('click', submit);
    ov.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  });
}
async function changePassword() {
  var cur = prompt('현재 비밀번호를 입력해주세요.');
  if (cur === null) return;
  if (!(await checkPw(cur))) { alert('비밀번호가 틀렸습니다.'); return; }
  var nw = prompt('새 비밀번호를 입력해주세요. (4자 이상)');
  if (nw === null) return;
  if (nw.length < 4) { alert('4자 이상으로 정해주세요.'); return; }
  await saveLock(nw);
  toast('비밀번호를 변경했습니다');
}

// ===== 시작 =====
(async function start() {
  applyTheme(getTheme());
  var unlocked = false;
  try { unlocked = sessionStorage.getItem('th-unlocked') === '1'; } catch (e) {}
  if (!unlocked || !getLock()) await showLockScreen();
  try {
    db = await openDB();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    await ensureSeed();
    await render();
  } catch (err) {
    appEl.innerHTML = '<p class="empty">저장소를 열 수 없습니다.<br>' + esc(err.message) + '</p>';
  }
})();
