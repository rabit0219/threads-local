<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>로컬 쓰레드</title>
<style>
:root {
  --bg: #ffffff; --bg2: #f5f5f5; --fg: #000000; --muted: #999999;
  --line: #e5e5e5; --line2: #d5d5d5; --btn: #000000; --btnfg: #ffffff;
  --like: #ff3040; --sheet: #ffffff; --ovl: rgba(0,0,0,.4); --field: #f7f7f7;
  --avbg: #d8d8d8; --avfg: #ffffff;
}
html[data-theme="dark"] {
  --bg: #0a0a0a; --bg2: #181818; --fg: #f3f5f7; --muted: #777777;
  --line: #262626; --line2: #333333; --btn: #ffffff; --btnfg: #000000;
  --like: #ff3040; --sheet: #181818; --ovl: rgba(0,0,0,.6); --field: #101010;
  --avbg: #3a3a3a; --avfg: #8f8f8f;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { overflow-x: hidden; max-width: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
    "Segoe UI", Roboto, sans-serif;
  font-size: 15px; color: var(--fg); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea { font-family: inherit; color: inherit; }
textarea { resize: none; }
svg { display: block; }

.wrap { max-width: 620px; margin: 0 auto; min-height: 100vh; }

/* ===== 앱바 ===== */
.appbar {
  position: sticky; top: 0; z-index: 60; background: var(--bg);
  height: 56px; display: flex; align-items: center; justify-content: center;
  max-width: 620px; margin: 0 auto;
}
.appbar .ab-left, .appbar .ab-right {
  position: absolute; top: 0; height: 56px; display: flex; align-items: center; padding: 0 16px;
}
.appbar .ab-left { left: 0; }
.appbar .ab-right { right: 0; }
.appbar .ab-title { font-size: 16px; font-weight: 700; }
.logo { font-size: 27px; font-weight: 800; letter-spacing: -1px; line-height: 1; }

/* ===== 탭바 ===== */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 60; background: var(--bg);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar-in { max-width: 620px; margin: 0 auto; display: flex; height: 56px; }
.tabbar a { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.tabbar a.on { color: var(--fg); }
.tabbar a:active { transform: scale(.9); }

.page { padding-bottom: 96px; }

/* ===== 포스트 ===== */
.post { display: flex; gap: 11px; padding: 14px 16px 10px; position: relative; }
.post.sep { border-top: 1px solid var(--line); }
.p-col-l { width: 38px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
.p-col-r { flex: 1; min-width: 0; }
.rail { flex: 1; width: 2px; background: var(--line2); border-radius: 1px; margin-top: 8px;
  margin-bottom: -22px; min-height: 8px; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #fff; font-size: 16px; user-select: none;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.default { background: var(--avbg); }
.avatar.default svg { width: 100%; height: 100%; display: block; fill: var(--avfg); }
.avatar.sm { width: 26px; height: 26px; font-size: 12px; }
.avatar.lg { width: 66px; height: 66px; font-size: 27px; }
.p-head { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.p-name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-topic {
  font-size: 15px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0; display: inline-flex; gap: 5px; align-items: center;
}
.p-topic .chev { color: var(--muted); flex-shrink: 0; }
.p-topic:active { opacity: .5; }
.p-time { color: var(--muted); font-size: 14px; flex-shrink: 0; }
.p-sp { flex: 1; }
.p-more { color: var(--muted); padding: 2px 0 2px 10px; flex-shrink: 0; }
.p-text { font-size: 15px; line-height: 1.42; white-space: pre-wrap; word-break: break-word; }
.p-text:empty { display: none; }
.p-imgs { display: flex; gap: 8px; margin-top: 9px; overflow-x: auto; scrollbar-width: none; }
.p-imgs::-webkit-scrollbar { display: none; }
.p-imgs img {
  max-height: 340px; max-width: 86%; border-radius: 12px; border: 1px solid var(--line);
  flex-shrink: 0;
}
.p-acts { display: flex; gap: 2px; margin: 8px 0 2px -8px; }
.p-act {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 20px;
  color: var(--fg); font-size: 13px;
}
.p-act:active { background: var(--bg2); }
.p-act.liked { color: var(--like); }
.p-act .cnt { color: var(--muted); font-size: 13px; }
.p-act.liked .cnt { color: var(--like); }
.p-meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
.post.clickable { cursor: pointer; }

/* 상세 */
.post.detail .p-text { font-size: 16px; }
.post.detail { padding-bottom: 4px; }
.detail-stats {
  padding: 8px 16px 14px; color: var(--muted); font-size: 14px;
}
.reply-head { padding: 14px 16px 2px; font-size: 15px; font-weight: 600; border-top: 1px solid var(--line); }
/* 답글 트리 연결선: 부모 아바타 중심에서 내려와 자식 아바타로 꺾여 들어간다 */
.rt-node { position: relative; padding-left: 38px; }
.rt-node::before {
  content: ''; position: absolute; left: 34px; top: 0; width: 20px; height: 33px;
  border-left: 2px solid var(--line2);
  border-bottom: 2px solid var(--line2);
  border-bottom-left-radius: 12px;
}
/* 형제 답글이 더 있으면 꺾인 지점 아래로 선을 이어 내린다 */
.rt-node:not(:last-child)::after {
  content: ''; position: absolute; left: 34px; top: 33px; bottom: 0; width: 2px;
  background: var(--line2);
}

.empty { text-align: center; color: var(--muted); padding: 64px 24px; font-size: 15px; line-height: 1.6; }

/* ===== 프로필 ===== */
.prof { padding: 18px 16px 4px; }
.prof-top { display: flex; align-items: flex-start; gap: 14px; }
.prof-info { flex: 1; min-width: 0; }
.prof-name { font-size: 22px; font-weight: 700; line-height: 1.2; }
.prof-handle { display: inline-flex; align-items: center; gap: 7px; margin-top: 5px; font-size: 15px; }
.prof-handle .sw {
  background: var(--bg2); border-radius: 12px; padding: 4px 10px; font-size: 13px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 4px;
}
.prof-bio { margin-top: 12px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
.prof-cnt { color: var(--muted); font-size: 15px; margin-top: 12px; }
.prof-btns { display: flex; gap: 8px; margin: 15px 0 4px; }
.btn-o {
  flex: 1; border: 1px solid var(--line2); border-radius: 10px; padding: 9px 0;
  font-size: 14px; font-weight: 600; text-align: center;
}
.btn-o:active { background: var(--bg2); }
.ptabs { display: flex; border-bottom: 1px solid var(--line); }
.ptabs button {
  flex: 1; padding: 13px 0; font-size: 15px; font-weight: 600; color: var(--muted);
  border-bottom: 1.5px solid transparent; margin-bottom: -1px;
}
.ptabs button.on { color: var(--fg); border-bottom-color: var(--fg); }

/* ===== 설정 ===== */
.sec-title { padding: 22px 16px 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 13px 16px;
  border-bottom: 1px solid var(--line); width: 100%; text-align: left;
}
.row:active { background: var(--bg2); }
.row-main { flex: 1; min-width: 0; }
.row-t { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.row-s { color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-r { color: var(--muted); font-size: 14px; flex-shrink: 0; }
.row.danger .row-t { color: #ff4444; }
.badge-me { background: var(--fg); color: var(--bg); font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 5px; }
.sw-toggle {
  width: 46px; height: 27px; border-radius: 14px; background: var(--line2); position: relative; flex-shrink: 0;
  transition: background .15s;
}
.sw-toggle.on { background: var(--fg); }
.sw-toggle i {
  position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%;
  background: var(--bg); transition: left .15s;
}
.sw-toggle.on i { left: 22px; }

/* ===== 모달 / 시트 ===== */
.ovl {
  position: fixed; left: 0; top: 0; width: 100%; height: 100vh; height: 100dvh;
  background: var(--ovl); z-index: 200; display: flex;
}
body.locked { position: fixed; left: 0; right: 0; width: 100%; overflow: hidden; }
.sheet {
  background: var(--sheet); width: 100%; max-width: 620px; margin: auto auto 0; border-radius: 18px 18px 0 0;
  padding-bottom: env(safe-area-inset-bottom); animation: up .18s ease-out; max-height: 86vh;
  overflow-y: auto; overscroll-behavior: contain;
}
@keyframes up { from { transform: translateY(100%); } }
.sheet-h { text-align: center; padding: 10px 16px 12px; font-size: 16px; font-weight: 700; }
.sheet-grab { width: 36px; height: 4px; background: var(--line2); border-radius: 2px; margin: 9px auto 2px; }
.sheet .row:last-child { border-bottom: none; }

.modal {
  background: var(--bg); width: 100%; max-width: 620px; margin: auto; height: 100%;
  display: flex; flex-direction: column; animation: up .18s ease-out;
}
.modal-h {
  display: flex; align-items: center; padding: 14px 16px; flex-shrink: 0;
  border-bottom: 1px solid var(--line);
}
.modal-h .m-t { flex: 1; text-align: center; font-size: 16px; font-weight: 700; }
.modal-h .m-c, .modal-h .m-d { font-size: 15px; min-width: 52px; }
.modal-h .m-d { text-align: right; font-weight: 700; }
.modal-h .m-d[disabled] { color: var(--muted); font-weight: 400; }
.modal-b { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 24px; }

.cbox { display: flex; gap: 11px; padding: 14px 16px 0; }
.cbox textarea {
  width: 100%; border: none; outline: none; background: none; font-size: 16px; line-height: 1.42;
  min-height: 26px; padding: 5px 0 0;
}
.cbox .c-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 5px; }
.cbox .c-name .chev { color: var(--muted); font-weight: 400; flex-shrink: 0; }
.c-topic {
  flex: 1; min-width: 0; border: none; outline: none; background: none;
  font-size: 15px; font-weight: 400; color: var(--fg); padding: 0;
}
.c-topic::placeholder { color: var(--muted); }
.topic-head {
  padding: 18px 16px 14px; border-bottom: 1px solid var(--line);
}
.topic-head h2 { font-size: 22px; font-weight: 700; }
.topic-head p { color: var(--muted); font-size: 14px; margin-top: 5px; }
.c-tools { display: flex; align-items: center; gap: 18px; padding: 10px 0 4px; color: var(--muted); }
.c-imgs { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.c-imgs::-webkit-scrollbar { display: none; }
.c-thumb { position: relative; flex-shrink: 0; }
.c-thumb img { height: 132px; border-radius: 10px; border: 1px solid var(--line); display: block; }
.c-thumb button {
  position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,.65); color: #fff;
  width: 22px; height: 22px; border-radius: 50%; font-size: 13px; line-height: 22px; text-align: center; padding: 0;
}
.c-add { display: flex; gap: 11px; padding: 10px 16px 16px; align-items: center; color: var(--muted); font-size: 15px; }
.c-add .avatar.sm { margin-left: 6px; }

.field { padding: 10px 16px; }
.field label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.field input, .field textarea {
  width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 12px; font-size: 16px; outline: none;
}
.field textarea { min-height: 78px; line-height: 1.4; }
.btn-fill {
  display: block; width: calc(100% - 32px); margin: 20px 16px; background: var(--btn); color: var(--btnfg);
  border-radius: 12px; padding: 13px 0; font-size: 15px; font-weight: 700; text-align: center;
}
.btn-fill[disabled] { opacity: .4; }
.avatar-pick { display: flex; align-items: center; gap: 16px; padding: 20px 16px 6px; }
.avatar-pick .ap-btns { display: flex; flex-direction: column; gap: 2px; }
.avatar-pick .ap-btns button { font-size: 14px; color: var(--muted); text-align: left; padding: 4px 0; }

.replybar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 55; background: var(--bg);
  padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
}
.replybar.open { border-top: 1px solid var(--line); }
.replybar-in { max-width: 620px; margin: 0 auto; }
.rb-ctx { padding: 4px 10px 9px; }
.rb-ctx-1 { color: var(--muted); font-size: 14px; }
.rb-ctx-2 {
  color: var(--muted); font-size: 14px; margin-top: 3px; opacity: .75;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rb-pill {
  display: flex; align-items: center; gap: 10px; width: 100%; background: var(--bg2);
  border-radius: 24px; padding: 9px 14px; text-align: left;
}
.rb-pill.open { align-items: flex-end; padding: 8px 14px; }
.rb-ph { flex: 1; color: var(--muted); font-size: 15px; }
.rb-ic { color: var(--muted); flex-shrink: 0; }
.rb-ta {
  flex: 1; min-width: 0; border: none; outline: none; background: none;
  font-size: 16px; line-height: 1.4; max-height: 118px; overflow-y: auto; padding: 4px 0;
}
.rb-post { font-weight: 700; font-size: 14px; flex-shrink: 0; padding: 4px 0 5px; }
.rb-post[disabled] { color: var(--muted); font-weight: 400; }
.rb-thumbs { display: flex; gap: 8px; padding: 0 10px 9px; overflow-x: auto; scrollbar-width: none; }
.rb-thumbs::-webkit-scrollbar { display: none; }
.rb-thumbs .c-thumb img { height: 84px; }

.imgview { position: fixed; inset: 0; background: #000; z-index: 300; display: flex; align-items: center; justify-content: center; }
.imgview img { max-width: 100%; max-height: 100%; }
.toast {
  position: fixed; bottom: 82px; left: 50%; transform: translateX(-50%); z-index: 400;
  background: var(--fg); color: var(--bg); padding: 11px 18px; border-radius: 10px; font-size: 14px;
  font-weight: 600; white-space: nowrap; animation: up .15s ease-out;
}

/* ===== 계정 관리 ===== */
.acc-tools { padding: 12px 16px 4px; }
.acc-search {
  width: 100%; background: var(--bg2); border: 1px solid var(--line); border-radius: 22px;
  padding: 11px 16px; font-size: 16px; outline: none;
}
.acc-search:focus { border-color: var(--line2); }
.chips { display: flex; gap: 7px; padding: 11px 16px 12px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; border: 1px solid var(--line2); border-radius: 18px; padding: 7px 14px;
  font-size: 13px; color: var(--muted); white-space: nowrap;
}
.chip.on { background: var(--fg); border-color: var(--fg); color: var(--bg); font-weight: 700; }
.acc-count { padding: 12px 16px 6px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
.acc-row { cursor: pointer; }
.acc-edit { color: var(--muted); padding: 9px 0 9px 14px; flex-shrink: 0; }
.acc-edit:active { color: var(--fg); }
.acc-more {
  display: block; width: calc(100% - 32px); margin: 14px 16px 24px; border: 1px solid var(--line2);
  border-radius: 12px; padding: 12px 0; font-size: 14px; font-weight: 600; text-align: center;
}
.gen-presets { display: flex; gap: 8px; padding: 0 16px 4px; }
.gen-presets button {
  flex: 1; border: 1px solid var(--line2); border-radius: 10px; padding: 10px 0;
  font-size: 14px; font-weight: 600;
}

/* 꾹 누르기 대상: iOS 복사/공유 팝업과 텍스트 선택을 막는다 */
[data-long] { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }

/* ===== 사진 크롭 ===== */
.crop-ov {
  position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,.96);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  touch-action: none; padding: 20px;
}
.crop-tip { color: rgba(255,255,255,.7); font-size: 13px; text-align: center; }
.crop-stage { position: relative; overflow: hidden; border-radius: 4px; }
.crop-stage img { display: block; user-select: none; -webkit-user-select: none; pointer-events: none; }
.crop-rect {
  position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,.6);
  cursor: move; touch-action: none;
}
.crop-rect.round { border-radius: 50%; }
.crop-handle { position: absolute; width: 30px; height: 30px; touch-action: none; }
.crop-handle::after {
  content: ''; position: absolute; width: 14px; height: 14px; background: #fff;
  border-radius: 50%; top: 8px; left: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.5);
}
.crop-handle.nw { top: -15px; left: -15px; cursor: nwse-resize; }
.crop-handle.ne { top: -15px; right: -15px; cursor: nesw-resize; }
.crop-handle.sw { bottom: -15px; left: -15px; cursor: nesw-resize; }
.crop-handle.se { bottom: -15px; right: -15px; cursor: nwse-resize; }
.crop-btns { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; }
.crop-btns button {
  border-radius: 22px; padding: 11px 20px; font-size: 15px; font-weight: 700;
  background: rgba(255,255,255,.16); color: #fff;
}
.crop-btns .crop-apply { background: #fff; color: #000; }

/* ===== 잠금 화면 ===== */
.lock {
  position: fixed; inset: 0; z-index: 1000; background: var(--bg);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.lock-card { width: 100%; max-width: 320px; text-align: center; }
.lock-logo { font-size: 56px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
.lock-desc { color: var(--muted); font-size: 14px; margin: 16px 0 22px; line-height: 1.5; }
.lock input {
  width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 14px; font-size: 16px; margin-bottom: 9px; outline: none; text-align: center;
}
.lock input:focus { border-color: var(--line2); }
.lock-btn {
  width: 100%; background: var(--btn); color: var(--btnfg); border-radius: 12px;
  padding: 13px 0; font-size: 15px; font-weight: 700; margin-top: 5px;
}
.lock-err { color: #ff4444; font-size: 13px; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="appbar" id="appbar"></header>
  <main class="page" id="app"></main>
</div>
<nav class="tabbar"><div class="tabbar-in" id="tabbar"></div></nav>
<script>
'use strict';
// =====================================================================
// 로컬 쓰레드 — 단일 HTML / IndexedDB / 서버 없음
// =====================================================================
var APP_VER = 'v1.11';
var DB_NAME = 'threads-local';
var K_ME = 'th-me';
var K_THEME = 'th-theme';

var db = null;
var ME = null;          // 현재 계정 객체
var USERS = [];         // 전체 계정
var POSTS = [];         // 전체 글
var LIKES = [];         // 전체 좋아요
var UMAP = {};          // id -> user
var KIDS = {};          // parent_id -> [post]
var LIKE_CNT = {};      // post_id -> count
var MY_LIKE = {};       // post_id -> true (현재 계정 기준)
var PROF_TAB = 'posts'; // 프로필 탭 상태
// 인라인 답글 바 상태
var RB_KEY = '';        // 어느 스레드의 바인지
var RB_TARGET = null;   // 답글을 달 대상 글 id
var RB_OPEN = false;
var RB_TEXT = '';
var RB_IMGS = [];

var appEl = document.getElementById('app');
var barEl = document.getElementById('appbar');
var tabEl = document.getElementById('tabbar');

// ===== 아이콘 =====
function ic(name, size) {
  var s = size || 24;
  var open = '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">';
  var P = {
    home: '<path d="M3 10.4 12 3l9 7.4V20a1 1 0 0 1-1 1h-4.5v-6.5h-7V21H4a1 1 0 0 1-1-1z"/>',

// ===== IndexedDB =====
function openDB() {
  return new Promise(function (resolve, reject) {
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function (e) {
      var d = e.target.result;
      if (!d.objectStoreNames.contains('users')) {
        d.createObjectStore('users', { keyPath: 'id', autoIncrement: true });
      }
      if (!d.objectStoreNames.contains('posts')) {
        var ps = d.createObjectStore('posts', { keyPath: 'id', autoIncrement: true });
        ps.createIndex('parent_id', 'parent_id');
        ps.createIndex('author_id', 'author_id');
      }
      if (!d.objectStoreNames.contains('likes')) {
        d.createObjectStore('likes', { keyPath: 'id' });
      }
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}
function tx(store, mode, fn) {
  return new Promise(function (resolve, reject) {
    var t = db.transaction(store, mode);
    var s = t.objectStore(store);
    var result;
    var r = fn(s);
    if (r && r.onsuccess !== undefined) {
      r.onsuccess = function () { result = r.result; };
    }
    t.oncomplete = function () { resolve(result); };
    t.onerror = function () { reject(t.error); };
    t.onabort = function () { reject(t.error); };
  });
}
function getAll(store) { return tx(store, 'readonly', function (s) { return s.getAll(); }); }
function getOne(store, id) { return tx(store, 'readonly', function (s) { return s.get(id); }); }
function put(store, obj) { return tx(store, 'readwrite', function (s) { return s.put(obj); }); }
function del(store, id) { return tx(store, 'readwrite', function (s) { return s.delete(id); }); }
function clearStore(store) { return tx(store, 'readwrite', function (s) { return s.clear(); }); }

// ===== 유틸 =====
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function rel(ts) {
  var d = Math.floor((Date.now() - ts) / 1000);
  if (d < 60) return '방금';
  if (d < 3600) return Math.floor(d / 60) + '분';
  if (d < 86400) return Math.floor(d / 3600) + '시간';
  if (d < 604800) return Math.floor(d / 86400) + '일';
  var t = new Date(ts);
  return (t.getMonth() + 1) + '월 ' + t.getDate() + '일';
}
function fullTime(ts) {
  var t = new Date(ts);
  function p(n) { return String(n).padStart(2, '0'); }
  return t.getFullYear() + '.' + p(t.getMonth() + 1) + '.' + p(t.getDate()) + ' ' +
    p(t.getHours()) + ':' + p(t.getMinutes());
}

// 이미지 리사이즈 → dataURL (저장소 절약)
function fileToDataUrl(file) {
  return new Promise(function (resolve) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var MAX = 1200;
        var w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        try { resolve(c.toDataURL('image/jpeg', 0.82)); }
        catch (e) { resolve(fr.result); }
      };
      img.onerror = function () { resolve(fr.result); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
// dataURL을 받아 크롭 UI를 띄우고 잘린 dataURL / 'full'(원본) / null(취소)을 돌려준다.
// aspect(가로/세로)를 주면 그 비율로 고정한다. round는 원형 미리보기(프로필용).
function openCropper(dataUrl, aspect, tip, round) {
  return new Promise(function (resolve) {
    var img = new Image();
    img.onload = function () {
      var maxW = Math.min(window.innerWidth * 0.9, 620);
      var maxH = window.innerHeight * 0.6;
      var fit = Math.min(maxW / img.width, maxH / img.height, 1);
      var dw = Math.max(1, Math.round(img.width * fit));
      var dh = Math.max(1, Math.round(img.height * fit));

      var ov = document.createElement('div');
      ov.className = 'crop-ov';
      ov.innerHTML =
        (tip ? '<p class="crop-tip">' + esc(tip) + '</p>' : '') +
        '<div class="crop-stage" style="width:' + dw + 'px;height:' + dh + 'px">' +
          '<img src="' + dataUrl + '" style="width:' + dw + 'px;height:' + dh + 'px" alt="">' +
          '<div class="crop-rect' + (round ? ' round' : '') + '" id="crop-rect">' +
            '<span class="crop-handle nw" data-h="nw"></span>' +
            '<span class="crop-handle ne" data-h="ne"></span>' +
            '<span class="crop-handle sw" data-h="sw"></span>' +
            '<span class="crop-handle se" data-h="se"></span>' +
          '</div>' +
        '</div>' +
        '<div class="crop-btns">' +
          '<button type="button" class="crop-cancel">취소</button>' +
          (aspect ? '' : '<button type="button" class="crop-full">원본 그대로</button>') +
          '<button type="button" class="crop-apply">완료</button>' +
        '</div>';
      document.body.appendChild(ov);

      var rect;
      if (aspect) {
        var w0 = dw * 0.92, h0 = w0 / aspect;
        if (h0 > dh * 0.92) { h0 = dh * 0.92; w0 = h0 * aspect; }
        rect = { x: Math.round((dw - w0) / 2), y: Math.round((dh - h0) / 2), w: Math.round(w0), h: Math.round(h0) };
      } else {
        rect = { x: 0, y: 0, w: dw, h: dh };
      }
      var rectEl = ov.querySelector('#crop-rect');
      function draw() {
        rectEl.style.left = rect.x + 'px';
        rectEl.style.top = rect.y + 'px';
        rectEl.style.width = rect.w + 'px';
        rectEl.style.height = rect.h + 'px';
      }
      draw();

      var MIN = 40;
      var drag = null;
      rectEl.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        var h = e.target.dataset && e.target.dataset.h;
        drag = { mode: h || 'move', sx: e.clientX, sy: e.clientY, r: { x: rect.x, y: rect.y, w: rect.w, h: rect.h } };
        try { rectEl.setPointerCapture(e.pointerId); } catch (err) {}
      });
      rectEl.addEventListener('pointermove', function (e) {
        if (!drag) return;
        var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy, r = drag.r;
        if (drag.mode === 'move') {
          rect.x = Math.min(Math.max(0, r.x + dx), dw - r.w);
          rect.y = Math.min(Math.max(0, r.y + dy), dh - r.h);
        } else if (aspect) {
          var m = drag.mode;
          var w = m.indexOf('w') >= 0 ? r.w - dx : r.w + dx;
          w = Math.max(MIN, w);
          var maxW2 = m.indexOf('w') >= 0 ? r.x + r.w : dw - r.x;
          var maxH2 = m.indexOf('n') >= 0 ? r.y + r.h : dh - r.y;
          w = Math.min(w, maxW2, maxH2 * aspect);
          var h2 = w / aspect;
          if (h2 < MIN) { h2 = MIN; w = h2 * aspect; }
          rect.w = w; rect.h = h2;
          rect.x = m.indexOf('w') >= 0 ? (r.x + r.w) - w : r.x;
          rect.y = m.indexOf('n') >= 0 ? (r.y + r.h) - h2 : r.y;
        } else {
          var x1 = r.x, y1 = r.y, x2 = r.x + r.w, y2 = r.y + r.h;
          if (drag.mode.indexOf('w') >= 0) x1 = Math.min(Math.max(0, r.x + dx), x2 - MIN);
          if (drag.mode.indexOf('e') >= 0) x2 = Math.max(Math.min(dw, r.x + r.w + dx), x1 + MIN);
          if (drag.mode.indexOf('n') >= 0) y1 = Math.min(Math.max(0, r.y + dy), y2 - MIN);
          if (drag.mode.indexOf('s') >= 0) y2 = Math.max(Math.min(dh, r.y + r.h + dy), y1 + MIN);
          rect.x = x1; rect.y = y1; rect.w = x2 - x1; rect.h = y2 - y1;
        }
        draw();
      });
      rectEl.addEventListener('pointerup', function () { drag = null; });
      rectEl.addEventListener('pointercancel', function () { drag = null; });

      function done(v) { ov.remove(); resolve(v); }
      ov.querySelector('.crop-cancel').addEventListener('click', function () { done(null); });
      var fullBtn = ov.querySelector('.crop-full');
      if (fullBtn) fullBtn.addEventListener('click', function () { done('full'); });
      ov.querySelector('.crop-apply').addEventListener('click', function () {
        var sc = img.width / dw; // 표시 좌표 → 원본 좌표
        var sx = Math.round(rect.x * sc), sy = Math.round(rect.y * sc);
        var sw = Math.max(1, Math.round(rect.w * sc)), sh = Math.max(1, Math.round(rect.h * sc));
        var out = Math.min(1, 1400 / Math.max(sw, sh));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(sw * out));
        c.height = Math.max(1, Math.round(sh * out));
        c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
        done(c.toDataURL('image/jpeg', 0.88));
      });
    };
    img.onerror = function () { resolve('full'); };
    img.src = dataUrl;
  });
}

// opts: { aspect, tip, round, single }
function pickImages(cb, opts) {
  var o = opts || {};
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  if (!o.single) inp.multiple = true;
  inp.addEventListener('change', async function () {
    var out = [];
    var max = o.single ? 1 : 4;
    for (var i = 0; i < inp.files.length && i < max; i++) {
      var url = await fileToDataUrl(inp.files[i]);
      var cropped = await openCropper(url, o.aspect, o.tip, o.round);
      if (cropped === null) continue;              // 이 사진만 건너뜀
      out.push(cropped === 'full' ? url : cropped);
    }
    if (out.length) cb(out);
  });
  inp.click();
}

// ===== 데이터 로드 =====
async function loadData() {
  USERS = await getAll('users');
  POSTS = await getAll('posts');
  LIKES = await getAll('likes');
  USERS.sort(function (a, b) { return a.id - b.id; });
  POSTS.sort(function (a, b) { return b.ts - a.ts; });
  UMAP = {};
  USERS.forEach(function (u) { UMAP[u.id] = u; });
  ME = UMAP[meId()] || USERS[0] || null;
  if (ME && ME.id !== meId()) setMeId(ME.id);
  KIDS = {};
  POSTS.forEach(function (p) {
    var k = p.parent_id == null ? 'root' : p.parent_id;
    (KIDS[k] = KIDS[k] || []).push(p);
  });
  Object.keys(KIDS).forEach(function (k) {
    KIDS[k].sort(function (a, b) { return a.ts - b.ts; });
  });
  LIKE_CNT = {}; MY_LIKE = {};
  LIKES.forEach(function (l) {
    LIKE_CNT[l.post_id] = (LIKE_CNT[l.post_id] || 0) + 1;
    if (ME && l.user_id === ME.id) MY_LIKE[l.post_id] = true;
  });
}
// 표시 개수 = 실제 좋아요 + 수동 가산치(likes_pad). 내 하트 상태는 실제 값 그대로 유지된다.
function likeCount(p) {
  return Math.max(0, (LIKE_CNT[p.id] || 0) + (p.likes_pad || 0));
}
function childrenOf(id, includeChain) {
  var a = KIDS[id] || [];
  return includeChain ? a.slice() : a.filter(function (p) { return !p.chain_of; });
}
function chainOf(rootId) {
  return (KIDS[rootId] || []).filter(function (p) { return p.chain_of; });
}
// 체인 포함 전체 줄기 (루트 → 체인 꼬리)
function chainLine(root) {
  var line = [root], cur = root;
  for (;;) {
    var next = chainOf(cur.id)[0];
    if (!next) break;
    line.push(next);
    cur = next;
  }
  return line;
}
function replyCount(id) {
  var n = 0;
  childrenOf(id, false).forEach(function (c) { n += 1 + replyCount(c.id); });
  return n;
}
function ancestorsOf(p) {
  var out = [], cur = p, guard = 0;
  while (cur.parent_id != null && guard++ < 200) {
    var par = POSTS.filter(function (x) { return x.id === cur.parent_id; })[0];
    if (!par) break;
    out.unshift(par);
    cur = par;
  }
  return out;
}

// ===== 포스트 한 줄 =====
function postRow(p, o) {
  o = o || {};
  var u = userById(p.author_id);
  var liked = !!MY_LIKE[p.id];
  var lc = likeCount(p);
  var rc = replyCount(p.id);
  var cls = 'post' + (o.sep ? ' sep' : '') + (o.detail ? ' detail' : '') + (o.detail ? '' : ' clickable');
  var attrs = o.detail ? '' : ' data-act="open" data-id="' + p.id + '"';

  var imgs = '';
  if (p.imgs && p.imgs.length) {
    imgs = '<div class="p-imgs">' + p.imgs.map(function (src) {
      return '<img src="' + src + '" data-act="img" data-src="' + src + '" alt="">';
    }).join('') + '</div>';
  }
  var acts =
    '<div class="p-acts">' +
      '<button class="p-act' + (liked ? ' liked' : '') + '" data-act="like" data-long="like" data-id="' + p.id + '">' +
        (liked ? icHeartFill(21) : ic('heart', 21)) +
        (lc ? '<span class="cnt">' + lc + '</span>' : '') +
      '</button>' +
      '<button class="p-act" data-act="reply" data-id="' + p.id + '">' + ic('bubble', 21) +
        (rc ? '<span class="cnt">' + rc + '</span>' : '') +
      '</button>' +
    '</div>';

  return '<div class="' + cls + '"' + attrs + '>' +
    '<div class="p-col-l">' +
      '<div data-act="user" data-long="user" data-id="' + u.id + '">' + avatarHtml(u) + '</div>' +
      (o.rail ? '<div class="rail"></div>' : '') +
    '</div>' +
    '<div class="p-col-r">' +
      '<div class="p-head">' +
        '<span class="p-name" data-act="user" data-long="user" data-id="' + u.id + '">' + esc(u.handle) + '</span>' +
        (p.topic ? '<span class="p-topic" data-act="topic" data-topic="' + esc(p.topic) + '">' +
          '<span class="chev">›</span>' + esc(p.topic) + '</span>' : '') +
        (o.detail ? '' : '<span class="p-time">' + rel(p.ts) + '</span>') +
        '<span class="p-sp"></span>' +
        '<button class="p-more" data-act="more" data-id="' + p.id + '">' + ic('more', 18) + '</button>' +
      '</div>' +
      '<div class="p-text">' + esc(p.text) + '</div>' +
      imgs + acts +
    '</div>' +
  '</div>';
}

// 피드 카드 = 루트 + 체인 전체
function feedCard(root, first) {
  var line = chainLine(root);
  return line.map(function (p, i) {
    return postRow(p, {
      sep: (i === 0 && !first),
      rail: i < line.length - 1
    });
  }).join('');
}

function listHtml(roots, emptyMsg) {
  if (!roots.length) return '<p class="empty">' + emptyMsg + '</p>';
  return roots.map(function (r, i) { return feedCard(r, i === 0); }).join('');
}

function viewFeed() {

  appEl.innerHTML = listHtml(roots,
    '아직 아무것도 없네요.<br>아래 연필 버튼으로 첫 스레드를 남겨보세요.');

// ===== 스레드 상세 =====
function viewPost(id) {
  var p = POSTS.filter(function (x) { return x.id === id; })[0];
  if (!p) { appEl.innerHTML = '<p class="empty">삭제되었거나 없는 스레드입니다.</p>'; bar({ back: true, title: '스레드' }); return; }
  bar({ back: true, title: '스레드' });
  var anc = ancestorsOf(p);
  var html = '';
  anc.forEach(function (a) { html += postRow(a, { rail: true }); });
  html += postRow(p, { detail: true, sep: anc.length > 0 });
  html += '<div class="detail-stats">' + fullTime(p.ts) +
    ' · 좋아요 ' + likeCount(p) + '개 · 답글 ' + replyCount(p.id) + '개</div>';

  // 체인 뒷부분
  var tail = chainOf(p.id);
  while (tail.length) {
    var t = tail[0];
    html += postRow(t, { sep: true });
    tail = chainOf(t.id);
  }

  var kids = childrenOf(p.id, false);
  html += '<div class="reply-head">답글 ' + (kids.length ? kids.length + '개' : '') + '</div>';
  if (!kids.length) {
    html += '<p class="empty" style="padding:32px 20px 40px">첫 번째 답글을 남겨보세요.</p>';
  } else {
    html += kids.map(function (k, i) { return replyTree(k, 0, i > 0); }).join('');
  }

function replyTree(p, depth, sep) {
  var kids = childrenOf(p.id, false);
  var html = postRow(p, { sep: sep, rail: kids.length > 0 });
  if (kids.length) {
    if (depth < 3) {
      // 자식마다 .rt-node로 감싸야 '마지막 형제' 판별이 되고 선이 정확히 끊긴다
      html += kids.map(function (k) {
        return '<div class="rt-node">' + replyTree(k, depth + 1, false) + '</div>';
      }).join('');
    } else {
      // 4단계부터는 더 들여쓰지 않는다 (모바일 폭 보호)
      html += kids.map(function (k) { return replyTree(k, depth + 1, false); }).join('');
    }
  }
  return html;
}

// ===== 라우터 =====
function parseHash() {
  var h = location.hash.replace(/^#/, '');
  if (h === '' || h === '/') return { route: 'feed' };
  var m = /^\/p\/(\d+)/.exec(h);
  if (m) return { route: 'post', id: parseInt(m[1], 10) };
  m = /^\/u\/(\d+)/.exec(h);
  if (m) return { route: 'user', id: parseInt(m[1], 10) };
  m = /^\/t\/(.+)$/.exec(h);
  if (m) {
    try { return { route: 'topic', name: decodeURIComponent(m[1]) }; }
    catch (e) { return { route: 'feed' }; }
  }
  if (h === '/me') return { route: 'me' };
  if (h === '/settings') return { route: 'settings' };
  if (h === '/accounts') return { route: 'accounts' };
  return { route: 'feed' };
}
var _lastRoute = '';
async function render() {
  await loadData();
  if (!ME) { await ensureSeed(); await loadData(); }
  var h = parseHash();
  var key = h.route + ':' + (h.id || h.name || '');
  if (key !== _lastRoute) PROF_TAB = 'posts';
  _lastRoute = key;
  var rb = document.querySelector('.replybar');
  if (rb) rb.remove();
  renderChrome();
  document.querySelector('.tabbar').style.display = h.route === 'post' ? 'none' : '';
  if (h.route !== 'post') { RB_KEY = ''; RB_TARGET = null; RB_OPEN = false; RB_TEXT = ''; RB_IMGS = []; }
  if (h.route !== 'accounts') { ACC_Q = ''; ACC_SORT = 'new'; ACC_LIMIT = 100; }
  if (h.route === 'post') viewPost(h.id);
  else if (h.route === 'user') viewUser(h.id, false);
  else if (h.route === 'me') viewUser(ME.id, true);
  else if (h.route === 'topic') viewTopic(h.name);
  else if (h.route === 'accounts') viewAccounts();
  else if (h.route === 'settings') viewSettings();
  else viewFeed();
  if (h.route !== 'post') window.scrollTo(0, 0);
}
function rerender() { return render(); }

var _lockY = 0;
function lockScroll() {
  if (document.body.classList.contains('locked')) return;
  _lockY = window.scrollY || window.pageYOffset || 0;
  document.body.style.top = -_lockY + 'px';
  document.body.classList.add('locked');
}
function unlockScroll() {
  if (!document.body.classList.contains('locked')) return;
  document.body.classList.remove('locked');
  document.body.style.top = '';
  window.scrollTo(0, _lockY);
}
// 모바일 키보드가 올라오면 보이는 영역이 줄어든다. 그 높이에 오버레이를 맞춘다.

}

  window.visualViewport.addEventListener('scroll', function () { syncOvl(); syncReplyBar(); });
}
function closeOvl() {
  var o = document.querySelector('.ovl');
  if (o) o.remove();
  unlockScroll();
}
function openOvl(inner, isSheet) {
  closeOvl();

  ov.innerHTML = inner;
  ov.addEventListener('click', function (e) {

  lockScroll();
  document.body.appendChild(ov);
  syncOvl();
  return ov;
}

function drawComposer(focusBox) {
  var ov = document.querySelector('.ovl');
  if (!ov) ov = openOvl(composerHtml(), false);
  else ov.innerHTML = composerHtml();
  var tas = ov.querySelectorAll('textarea');
  tas.forEach(function (ta) {
    autoGrow(ta);
    ta.addEventListener('input', function () {
      CBOX[parseInt(ta.dataset.box, 10)].text = ta.value;
      autoGrow(ta);
      var btn = ov.querySelector('[data-act="c-submit"]');
      var can = CBOX.some(function (b) { return b.text.trim() || b.imgs.length; });
      if (can) btn.removeAttribute('disabled'); else btn.setAttribute('disabled', '');
      var addBtn = ov.querySelector('.c-add');
      if (addBtn && CREPLY == null) {
        var lastBox = CBOX[CBOX.length - 1];
        var ready = !!(lastBox.text.trim() || lastBox.imgs.length);
        if (ready && addBtn.tagName !== 'BUTTON') drawComposer(CBOX.length - 1);
        else if (!ready && addBtn.tagName === 'BUTTON') drawComposer(CBOX.length - 1);
      }
    });
  });
  var tp = ov.querySelector('#c-topic');
  if (tp) tp.addEventListener('input', function () { CTOPIC = tp.value; });
  var idx = focusBox == null ? 0 : focusBox;
  if (tas[idx]) {
    tas[idx].focus({ preventScroll: true });
    tas[idx].setSelectionRange(tas[idx].value.length, tas[idx].value.length);
    setTimeout(syncOvl, 60);
  }
}
function openComposer(replyTo) {
  CREPLY = replyTo == null ? null : replyTo;
  CBOX = [{ text: '', imgs: [] }];
  CTOPIC = '';
  drawComposer(0);
}
async function submitComposer() {
  var boxes = CBOX.filter(function (b) { return b.text.trim() || b.imgs.length; });
  if (!boxes.length) return;
  var t = Date.now();
  var topic = (CTOPIC || '').trim().replace(/^[#›\s]+/, '').slice(0, 30) || null;
  if (CREPLY != null) {
    await put('posts', {
      author_id: ME.id, text: boxes[0].text.trim(), imgs: boxes[0].imgs,
      parent_id: CREPLY, chain_of: null, topic: null, ts: t
    });
  } else {
    var rootId = null, prevId = null;
    for (var i = 0; i < boxes.length; i++) {
      var id = await put('posts', {
        author_id: ME.id, text: boxes[i].text.trim(), imgs: boxes[i].imgs,
        parent_id: prevId, chain_of: rootId, topic: topic, ts: t + i
      });
      if (i === 0) rootId = id;
      prevId = id;
    }
  }
  closeOvl();
  CBOX = []; CREPLY = null; CTOPIC = '';
  await render();
  toast(topic ? topic + '에 게시했습니다' : '게시했습니다');
}

async function deletePostDeep(pid) {
  var stack = [pid], all = [];
  while (stack.length) {
    var cur = stack.pop();
    all.push(cur);
    (KIDS[cur] || []).forEach(function (c) { stack.push(c.id); });
  }
  for (var i = 0; i < all.length; i++) {
    await del('posts', all[i]);
    var ls = LIKES.filter(function (l) { return l.post_id === all[i]; });
    for (var j = 0; j < ls.length; j++) await del('likes', ls[j].id);
  }
}

function syncEdit() {

function readEdit() {
  ['name', 'handle', 'bio'].forEach(function (k) {
    var el = document.getElementById('e-' + k);

  });
}
async function saveEdit() {
  readEdit();
  var name = (EDIT.name || '').trim();
  var handle = (EDIT.handle || '').trim().replace(/^@/, '').replace(/[^A-Za-z0-9._]/g, '');
  if (!name) { toast('이름을 입력해주세요'); return; }
  if (!handle) { toast('아이디를 입력해주세요'); return; }
  var dup = USERS.some(function (u) { return u.handle === handle && u.id !== EDIT.id; });
  if (dup) { toast('이미 쓰고 있는 아이디입니다'); return; }
  var obj = {
    name: name, handle: handle, bio: (EDIT.bio || '').trim(), avatar: EDIT.avatar
  };
  if (EDIT.id != null) obj.id = EDIT.id;
  var id = await put('users', obj);
  if (EDIT.id == null) setMeId(id);
  closeOvl();
  EDIT = null;
  await render();
  toast(obj.id ? '저장했습니다' : handle + ' 계정을 만들었습니다');
}
async function deleteAccount(id) {
  if (USERS.length <= 1) { toast('마지막 계정은 지울 수 없습니다'); return; }
  var u = userById(id);
  if (!confirm(u.handle + ' 계정과 이 계정이 쓴 스레드를 모두 삭제할까요?')) return;
  var theirs = POSTS.filter(function (p) { return p.author_id === id; });
  for (var i = 0; i < theirs.length; i++) {
    await del('posts', theirs[i].id);
  }
  var ls = LIKES.filter(function (l) {
    return l.user_id === id || theirs.some(function (p) { return p.id === l.post_id; });
  });
  for (var j = 0; j < ls.length; j++) await del('likes', ls[j].id);
  await del('users', id);
  if (meId() === id) {
    var rest = USERS.filter(function (x) { return x.id !== id; });
    setMeId(rest[0].id);
  }
  closeOvl();
  EDIT = null;
  await render();
  toast('계정을 삭제했습니다');
}

async function exportData() {
  var data = { app: 'threads-local', ver: APP_VER, at: Date.now(), users: USERS, posts: POSTS, likes: LIKES };
  var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'threads-local-backup.json';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
  toast('내보냈습니다');
}
function importData() {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json,.json';
  inp.addEventListener('change', function () {
    var fr = new FileReader();
    fr.onload = async function () {
      try {
        var d = JSON.parse(fr.result);
        if (!d.users || !d.posts) throw new Error('형식이 맞지 않습니다');
        if (!confirm('현재 데이터를 모두 지우고 백업으로 덮어쓸까요?')) return;
        await clearStore('users'); await clearStore('posts'); await clearStore('likes');
        for (var i = 0; i < d.users.length; i++) await put('users', d.users[i]);
        for (var j = 0; j < d.posts.length; j++) await put('posts', d.posts[j]);
        for (var k = 0; k < (d.likes || []).length; k++) await put('likes', d.likes[k]);
        setMeId(d.users[0].id);
        await render();
        toast('불러왔습니다');
      } catch (e) { alert('불러오지 못했습니다: ' + e.message); }
    };
    fr.readAsText(inp.files[0]);
  });
  inp.click();
}
async function wipeAll() {
  if (!confirm('모든 계정과 스레드를 지우고 처음 상태로 되돌릴까요?')) return;
  await clearStore('users'); await clearStore('posts'); await clearStore('likes');
  try { localStorage.removeItem(K_ME); } catch (e) {}
  await ensureSeed();
  await render();
  nav('#/');
  toast('초기화했습니다');
}

// 구분자를 섞어 아이디가 한 가지 모양으로 굳지 않게 한다
function join2(a, b) {
  var r = Math.random();
  if (r < 0.4) return a + '_' + b;
  if (r < 0.7) return a + '.' + b;
  return a + b;
}
function makeAccount() {
  var r = Math.random(), name, handle, bio = '';
  if (r < 0.22) {                       // 이름칸에 아이디를 그대로 넣는 유형
    var n1 = pick(G_NICK_A);
    handle = chance(0.5) ? join2(n1.en, pick(G_EN)) : join2(pick(G_EN), digits());
    name = handle;
  } else if (r < 0.40) {                // 한글 닉네임
    var a = pick(G_NICK_A), b = pick(G_NICK_B);
    name = a.ko + b.ko;
    handle = b.en ? join2(a.en, b.en) : a.en + (chance(0.5) ? digits() : '');
  } else if (r < 0.54) {                // 한글 + 이모지
    var g1 = pick(G_GIV);
    name = g1.ko + ' ' + pick(G_EMOJI);
    handle = chance(0.4) ? '_' + g1.en + '_' : join2(g1.en, chance(0.5) ? digits() : pick(G_EN));
  } else if (r < 0.66) {                // 이중언어 병기
    var g2 = pick(G_GIV);
    var en2 = g2.en.charAt(0).toUpperCase() + g2.en.slice(1);
    name = chance(0.5) ? g2.ko + ' | ' + en2 : en2 + ' ' + g2.ko;
    handle = g2.en + '.' + pick(G_SUR).en.charAt(0);
  } else if (r < 0.78) {                // 실명
    var su = pick(G_SUR), gi = pick(G_GIV);
    name = su.ko + gi.ko;
    handle = chance(0.5) ? gi.en + '.' + su.en.charAt(0) : join2(gi.en, su.en);
  } else if (r < 0.86) {                // 멋부린 영문
    var w = pick(G_EN);
    name = w.toUpperCase().split('').join(' ');
    handle = chance(0.5) ? '___' + w + '___' : '_' + w + '_' + digits();
  } else if (r < 0.94) {                // 가게·브랜드
    var br = pick(G_BRAND), ar = pick(G_AREA);
    name = ar.ko + ' ' + br.ko + ' ' + pick(G_BRAND_TAIL);
    handle = join2(ar.en, br.en) + (chance(0.3) ? '.official' : '');
    bio = pick(G_BRAND_TAIL);
  } else {                              // 직함형
    var job = pick(G_JOB), ar2 = pick(G_AREA), su2 = pick(G_SUR);
    name = (2 + Math.floor(Math.random() * 9)) + '년차 ' + job.ko + ' / ' + ar2.ko;
    handle = join2(job.en, chance(0.5) ? su2.en : ar2.en) + (chance(0.4) ? '.log' : '');
    bio = job.ko + ' 하는 사람';
  }
  handle = handle.toLowerCase().replace(/[^a-z0-9._]/g, '');
  if (!handle) handle = 'user' + digits();
  if (!bio && chance(0.6)) bio = pick(G_BIO);
  return { name: name, handle: handle, bio: bio, avatar: null, gen: true };
}
function putMany(store, arr) {
  return new Promise(function (resolve, reject) {
    var t = db.transaction(store, 'readwrite');
    var st = t.objectStore(store);
    arr.forEach(function (o) { st.put(o); });
    t.oncomplete = function () { resolve(); };
    t.onerror = function () { reject(t.error); };
    t.onabort = function () { reject(t.error); };
  });
}
async function generateAccounts(n) {
  var taken = {};
  USERS.forEach(function (u) { taken[u.handle] = 1; });
  var out = [];
  for (var i = 0; i < n; i++) {
    var a = makeAccount(), guard = 0;
    var base = a.handle;
    while (taken[a.handle] && guard++ < 40) a.handle = base + digits();
    if (taken[a.handle]) continue;
    taken[a.handle] = 1;
    out.push(a);
  }
  await putMany('users', out);
  return out.length;
}
async function deleteGenerated() {
  var gens = USERS.filter(function (u) { return u.gen && u.id !== ME.id; });
  if (!gens.length) { toast('지울 랜덤 계정이 없습니다'); return; }
  if (!confirm('랜덤으로 만든 계정 ' + gens.length + '개와 그 계정들이 쓴 스레드를 모두 삭제할까요?')) return;
  var ids = {};
  gens.forEach(function (u) { ids[u.id] = 1; });
  var theirPosts = POSTS.filter(function (p) { return ids[p.author_id]; });
  var pids = {};
  theirPosts.forEach(function (p) { pids[p.id] = 1; });
  var deadLikes = LIKES.filter(function (l) { return ids[l.user_id] || pids[l.post_id]; });
  await delMany('likes', deadLikes.map(function (l) { return l.id; }));
  await delMany('posts', theirPosts.map(function (p) { return p.id; }));
  await delMany('users', gens.map(function (u) { return u.id; }));
  await render();
  toast(gens.length + '개 계정을 삭제했습니다');
}
function delMany(store, keys) {
  if (!keys.length) return Promise.resolve();
  return new Promise(function (resolve, reject) {
    var t = db.transaction(store, 'readwrite');
    var st = t.objectStore(store);
    keys.forEach(function (k) { st.delete(k); });
    t.oncomplete = function () { resolve(); };
    t.onerror = function () { reject(t.error); };
    t.onabort = function () { reject(t.error); };
  });
}

var LP_TIMER = null, LP_FROM = null, LP_EL = null, LP_FIRED = false;

function lpFire(el) {

  var id = el.dataset.id ? parseInt(el.dataset.id, 10) : null;
  if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }

document.addEventListener('pointerdown', function (e) {
  var el = e.target.closest && e.target.closest('[data-long]');
  LP_FIRED = false;
  if (!el) return;
  LP_EL = el;
  LP_FROM = { x: e.clientX, y: e.clientY };
  clearTimeout(LP_TIMER);
  LP_TIMER = setTimeout(function () {
    LP_TIMER = null;
    LP_FIRED = true;
    var target = LP_EL;
    lpCancel();
    if (target) lpFire(target);
  }, 500);
}, true);
document.addEventListener('pointermove', function (e) {
  if (!LP_TIMER || !LP_FROM) return;
  if (Math.abs(e.clientX - LP_FROM.x) > 10 || Math.abs(e.clientY - LP_FROM.y) > 10) lpCancel();
}, true);

// 꾹 눌러 뜬 시트 위로 클릭이 흘러들어가지 않게 막는다

  e.preventDefault();
}, true);

});
window.addEventListener('hashchange', function () { closeOvl(); render(); });

// ===== 잠금 =====
var K_LOCK = 'th-lock';
async function sha256Hex(str) {
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
}
function getLock() {
  try { return JSON.parse(localStorage.getItem(K_LOCK)); } catch (e) { return null; }
}
async function saveLock(pw) {
  var salt = Array.from(crypto.getRandomValues(new Uint8Array(16)))
    .map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  localStorage.setItem(K_LOCK, JSON.stringify({ salt: salt, hash: await sha256Hex(salt + pw) }));
}
async function checkPw(pw) {
  var lock = getLock();
  if (!lock) return false;
  return (await sha256Hex(lock.salt + pw)) === lock.hash;
}
function showLockScreen() {
  return new Promise(function (resolve) {
    var isSetup = !getLock();
    var ov = document.createElement('div');
    ov.className = 'lock';
    ov.innerHTML = '<div class="lock-card">' +
      '<div class="lock-logo">@</div>' +
      '<div class="lock-desc">' + (isSetup
        ? '처음 오셨네요.<br>사용할 비밀번호를 정해주세요.'
        : '비밀번호를 입력해주세요.') + '</div>' +
      '<input type="password" id="lk1" placeholder="비밀번호" autocomplete="off" inputmode="text">' +
      (isSetup ? '<input type="password" id="lk2" placeholder="비밀번호 확인" autocomplete="off">' : '') +
      '<button class="lock-btn" id="lkgo">' + (isSetup ? '설정하고 시작하기' : '확인') + '</button>' +
      '<p class="lock-err" id="lkerr"></p></div>';
    document.body.appendChild(ov);
    var pw1 = ov.querySelector('#lk1');
    var errEl = ov.querySelector('#lkerr');
    pw1.focus();
    async function submit() {
      var v = pw1.value;
      if (isSetup) {
        var v2 = ov.querySelector('#lk2').value;
        if (v.length < 4) { errEl.textContent = '4자 이상으로 정해주세요.'; return; }
        if (v !== v2) { errEl.textContent = '두 입력이 서로 다릅니다.'; return; }
        await saveLock(v);
      } else if (!(await checkPw(v))) {
        errEl.textContent = '비밀번호가 틀렸습니다.';
        pw1.value = '';
        pw1.focus();
        return;
      }
      try { sessionStorage.setItem('th-unlocked', '1'); } catch (e) {}
      ov.remove();
      resolve();
    }
    ov.querySelector('#lkgo').addEventListener('click', submit);
    ov.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  });
}
async function changePassword() {
  var cur = prompt('현재 비밀번호를 입력해주세요.');
  if (cur === null) return;
  if (!(await checkPw(cur))) { alert('비밀번호가 틀렸습니다.'); return; }
  var nw = prompt('새 비밀번호를 입력해주세요. (4자 이상)');
  if (nw === null) return;
  if (nw.length < 4) { alert('4자 이상으로 정해주세요.'); return; }
  await saveLock(nw);
  toast('비밀번호를 변경했습니다');
}

// ===== 시작 =====
(async function start() {
  applyTheme(getTheme());
  var unlocked = false;
  try { unlocked = sessionStorage.getItem('th-unlocked') === '1'; } catch (e) {}
  if (!unlocked || !getLock()) await showLockScreen();
  try {
    db = await openDB();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    await ensureSeed();
    await render();
  } catch (err) {
    appEl.innerHTML = '<p class="empty">저장소를 열 수 없습니다.<br>' + esc(err.message) + '</p>';
  }
})();
</script>
